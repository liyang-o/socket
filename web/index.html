<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quant Paper Trader</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero">
      <div>
        <p class="eyebrow">SMA Crossover · Paper Trading · Intraday Dashboard</p>
        <h1>yangzaili 量化小试牛刀</h1>
        <p class="hero-text">
          使用实时/延迟行情与历史数据运行可扩展策略池，展示区间收益、持仓、交易记录与股票涨跌曲线。
        </p>
      </div>
      <div class="hero-side">
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="切换亮色主题">
          亮色模式
        </button>
        <div class="status-card">
          <span id="sourceBadge">等待行情</span>
          <strong id="updatedAt">--</strong>
          <p id="marketMeta">--</p>
          <p id="latestBarMeta">--</p>
        </div>
      </div>
    </header>

    <main>
      <section class="panel controls">
        <label>
          股票池
          <select id="universeInput">
            <option value="custom">自定义</option>
            <option value="us_top_100">美股热门 Top 100</option>
            <option value="a_share_core">A股热门核心</option>
          </select>
        </label>
        <label>
          股票代码
          <input id="symbolsInput" value="AAPL,MSFT,NVDA" autocomplete="off" />
        </label>
        <label>
          策略
          <select id="strategyInput">
            <option value="sma_cross">SMA 双均线趋势</option>
            <option value="rsi_reversion">RSI 均值回归</option>
            <option value="bollinger_reversion">布林带均值回归</option>
            <option value="hybrid_reversion">RSI + 布林带混合</option>
            <option value="momentum_rotation">多资产动量轮动</option>
            <option value="dual_momentum">双动量轮动</option>
            <option value="trend_pullback">趋势过滤回调</option>
            <option value="regime_adaptive">Regime 自适应</option>
            <option value="multi_factor_top">多因子 Top N</option>
          </select>
        </label>
        <label>
          历史范围
          <select id="rangeInput">
            <option value="1d">1 天</option>
            <option value="1mo">1 个月</option>
            <option value="3mo">3 个月</option>
            <option value="6mo" selected>6 个月</option>
            <option value="1y">1 年</option>
            <option value="2y">2 年</option>
          </select>
        </label>
        <label>
          周期
          <select id="intervalInput">
            <option value="1m">1 分钟</option>
            <option value="5m">5 分钟</option>
            <option value="1h">1 小时</option>
            <option value="1d" selected>1 天</option>
          </select>
        </label>
        <label>
          初始资金
          <input id="cashInput" type="number" min="1000" step="1000" value="100000" />
        </label>
        <label>
          Fast SMA
          <input id="fastInput" type="number" min="2" value="12" />
        </label>
        <label>
          Slow SMA
          <input id="slowInput" type="number" min="3" value="26" />
        </label>
        <label>
          Top N
          <input id="topNInput" type="number" min="1" max="50" value="10" />
        </label>
        <button id="runButton">运行模拟</button>
        <label class="check-row">
          <input id="autoRefresh" type="checkbox" checked />
          60 秒自动刷新
        </label>
      </section>

      <section class="metrics">
        <article class="metric">
          <span>组合权益</span>
          <strong id="equityMetric">--</strong>
        </article>
        <article class="metric">
          <span>区间收益</span>
          <strong id="returnMetric">--</strong>
        </article>
        <article class="metric">
          <span>盈亏</span>
          <strong id="pnlMetric">--</strong>
        </article>
        <article class="metric">
          <span>交易次数</span>
          <strong id="tradesMetric">--</strong>
        </article>
        <article class="metric">
          <span>最大回撤</span>
          <strong id="drawdownMetric">--</strong>
        </article>
        <article class="metric">
          <span>Sharpe</span>
          <strong id="sharpeMetric">--</strong>
        </article>
        <article class="metric">
          <span>胜率</span>
          <strong id="winRateMetric">--</strong>
        </article>
      </section>

      <section class="grid">
        <article class="panel chart-panel">
          <div class="section-title">
            <div>
              <h2>所选股票涨跌曲线</h2>
              <p>收盘价、Fast SMA、Slow SMA 与买卖信号</p>
            </div>
            <select id="symbolSelect" aria-label="选择股票"></select>
          </div>
          <div id="priceChart" class="chart"></div>
        </article>

        <article class="panel chart-panel">
          <div class="section-title">
            <div>
              <h2>权益曲线</h2>
              <p>纸面账户随每根日内 bar 变化</p>
            </div>
          </div>
          <div id="equityChart" class="chart"></div>
        </article>
      </section>

      <section class="grid">
        <article class="panel">
          <h2>持仓</h2>
          <div id="positionsTable" class="table"></div>
        </article>
        <article class="panel">
          <h2>交易记录</h2>
          <div id="tradesTable" class="table"></div>
        </article>
      </section>

      <p id="errorBox" class="error" hidden></p>
    </main>

    <script src="app.js" type="module"></script>
  </body>
</html>
